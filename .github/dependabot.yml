version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: [chore]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    labels: [chore]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [chore]
    commit-message:
      prefix: ci
