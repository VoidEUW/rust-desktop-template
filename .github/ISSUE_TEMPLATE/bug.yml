name: Bug
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Include error messages and logs.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: App version, OS and version
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] The steps above produce the expected result
        - [ ] A test covers it
