name: Feature
description: Something new the app should do.
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't a user do today, or what is harder than it should be?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead? Sketches and screenshots welcome.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: The checks that tell everyone this is done. The issue is Ready once these are filled in.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Out of scope, open questions, related issues.
