<!doctype html>
<!--
	Theme picture for docs/themes/<name>.png. Rendered by render.mjs, which injects the theme's
	token block and tables below. Every specimen uses only theme/1 tokens (docs/themes/system.md)
	and takes its look from the theme's Looks table.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!--THEME-FONTS-->
		<style>
			/*THEME-TOKENS*/
		</style>
		<style>
			* { box-sizing: border-box; }
			body { margin: 0; width: 1440px; background: #0b0c0f; color: #e8ebf0; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
			.sheet { padding: 48px; }
			.mono { font-family: ui-monospace, Menlo, monospace; }
			.eyebrow { font: 600 11px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.1em; text-transform: uppercase; color: #8a929e; }
			header { display: flex; justify-content: space-between; gap: 48px; margin-bottom: 32px; }
			header h1 { margin: 10px 0 8px; font-size: 44px; font-weight: 600; letter-spacing: -0.01em; }
			header p { margin: 0; max-width: 62ch; color: #a2aab6; font-size: 15px; }
			.meta { display: grid; grid-template-columns: auto auto; gap: 4px 20px; font-size: 12px; align-self: start; }
			.meta dt { color: #8a929e; }
			.meta dd { margin: 0; font-family: ui-monospace, Menlo, monospace; }
			.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
			.below { display: grid; grid-template-columns: 3fr 2fr; gap: 48px; margin-top: 40px; }
			.below table { width: 100%; border-collapse: collapse; font-size: 12px; }
			.below td { padding: 5px 8px 5px 0; border-bottom: 1px solid #1e232b; vertical-align: top; }
			.below td:not(:first-child) { font-family: ui-monospace, Menlo, monospace; color: #a2aab6; }
			.below h2 { margin: 0 0 12px; }
			.cols { columns: 2; column-gap: 32px; }
			.cols table { break-inside: avoid; }

			/* ---- Everything below uses theme tokens only ---- */
			.panel { padding: calc(var(--space) * 6); border-radius: var(--radius-lg); background: var(--ground); color: var(--text); font-family: var(--font-ui); font-size: var(--ui-size); border: var(--border-width) solid var(--line); }
			.panel > * + * { margin-top: calc(var(--space) * 6); }
			.row { display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--space) * 2); }
			.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--space) * 4); align-items: start; }
			.stack > * + * { margin-top: calc(var(--space) * 3); }
			.label { font: 600 11px/1 var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); }
			.panel-head { display: flex; justify-content: space-between; }
			svg.i { width: var(--icon-size); height: var(--icon-size); flex: none; fill: none; stroke: currentColor; stroke-width: var(--icon-stroke); stroke-linecap: round; stroke-linejoin: round; }

			.look-open { --look-bg: transparent; --look-border: var(--line); --look-radius: var(--radius-sm); --look-shadow: none; }
			.look-soft { --look-bg: var(--surface-raised); --look-border: transparent; --look-radius: var(--radius); --look-shadow: none; }
			.look-soft.is-panel { --look-bg: var(--surface); }
			.look-float { --look-bg: var(--surface); --look-border: transparent; --look-radius: var(--radius-lg); --look-shadow: var(--shadow); }
			.looked { background: var(--look-bg); border: var(--border-width) solid var(--look-border); border-radius: var(--look-radius); box-shadow: var(--look-shadow); }

			.swatches { display: grid; grid-template-columns: repeat(12, 1fr); gap: calc(var(--space) * 1.5); }
			.swatch i { display: block; height: 36px; border-radius: var(--radius-sm); border: var(--border-width) solid var(--line); }
			.swatch b { display: block; margin-top: 6px; font-weight: 500; font-size: 10px; color: var(--text-muted); }
			.swatch code { font: 9px var(--font-mono); color: var(--text-faint); }

			.type div { display: flex; align-items: baseline; gap: calc(var(--space) * 4); }
			.type small { width: 52px; flex: none; font: 10px var(--font-mono); color: var(--text-faint); }
			.t-display { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 28px; }
			.t-body { font-family: var(--font-body); font-size: var(--body-size); line-height: 1.55; }
			.t-mono { font-family: var(--font-mono); font-size: 13px; }

			.btn { display: inline-flex; align-items: center; gap: calc(var(--space) * 1.5); height: calc(var(--space) * 8); padding: 0 calc(var(--space) * 3.5); font: 500 var(--ui-size) var(--font-ui); color: var(--text); }
			.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
			.btn.danger { background: var(--danger); border-color: var(--danger); color: var(--on-danger); }
			.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--text-muted); }
			.btn.disabled { color: var(--text-faint); opacity: 0.7; }
			.btn.icon { width: calc(var(--space) * 8); padding: 0; justify-content: center; }
			.close { display: inline-grid; place-items: center; width: calc(var(--space) * 7); height: calc(var(--space) * 7); color: var(--text-muted); border-radius: var(--radius-pill) !important; }
			.close.look-open { border-color: transparent; background: var(--hover); }

			.window { display: grid; grid-template-columns: 210px 1fr; min-height: 330px; border: var(--border-width) solid var(--line); border-radius: var(--radius); overflow: hidden; }
			.sidebar { display: flex; flex-direction: column; gap: calc(var(--space) * 2); padding: calc(var(--space) * 3); }
			.sidebar.look-open { border-width: 0 var(--border-width) 0 0; border-radius: 0; }
			.sidebar.look-float, .sidebar.look-soft { margin: calc(var(--space) * 2); }
			.sb-head { display: flex; align-items: center; justify-content: space-between; font-weight: 600; padding: 0 calc(var(--space) * 1); }
			.search { display: flex; align-items: center; gap: calc(var(--space) * 2); height: calc(var(--space) * 8); padding: 0 calc(var(--space) * 2.5); color: var(--text-faint); }
			.search span { flex: 1; }
			.group { display: flex; align-items: center; gap: calc(var(--space) * 1.5); margin-top: calc(var(--space) * 2); padding: 0 calc(var(--space) * 1); }
			.group .count { margin-left: auto; font: 10px var(--font-mono); color: var(--text-faint); }
			.entry { display: flex; align-items: center; gap: calc(var(--space) * 2); height: calc(var(--space) * 8); padding: 0 calc(var(--space) * 2); color: var(--text-muted); border-radius: var(--radius-sm); }
			.entry.hover { background: var(--hover); color: var(--text); }
			.entry.active { background: var(--accent-soft); color: var(--text); }
			.entry.active.bar { background: transparent; box-shadow: inset 2px 0 0 var(--accent); border-radius: 0; }
			.entry .meta-r { margin-left: auto; font-size: 11px; color: var(--text-faint); }
			.sb-foot { margin-top: auto; }
			.main { display: flex; flex-direction: column; min-width: 0; }
			.topbar { display: flex; align-items: center; justify-content: space-between; height: calc(var(--space) * 12); padding: 0 calc(var(--space) * 4); border-width: 0 0 var(--border-width) 0; border-radius: 0; box-shadow: none; }
			.topbar.look-soft, .topbar.look-float { margin: calc(var(--space) * 2); border-width: var(--border-width); }
			.topbar strong { font-weight: 600; }
			.content { padding: calc(var(--space) * 4); display: grid; gap: calc(var(--space) * 3); }

			.tabs { display: inline-flex; padding: 3px; gap: 2px; }
			.tabs span { padding: calc(var(--space) * 1.25) calc(var(--space) * 3); border-radius: calc(var(--look-radius) - 2px); color: var(--text-muted); }
			.tabs span.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
			.tabs.look-open span.on { background: transparent; box-shadow: inset 0 -2px 0 var(--accent); border-radius: 0; }

			.card { padding: calc(var(--space) * 3.5); }
			.card.look-open, .collapsible.look-open { border-radius: var(--radius); }
			.card-head { display: flex; align-items: center; gap: calc(var(--space) * 2); font-weight: 600; }
			.card p { margin: calc(var(--space) * 1.5) 0 0; color: var(--text-muted); font-family: var(--font-body); font-size: var(--body-size); }

			.field label { display: block; margin-bottom: calc(var(--space) * 1.5); color: var(--text-muted); }
			.input { display: flex; align-items: center; height: calc(var(--space) * 9); padding: 0 calc(var(--space) * 3); color: var(--text); }
			.input.ph { color: var(--text-faint); }
			.input.focused { border-color: var(--focus); }
			.input.error { border-color: var(--danger); }
			.help { margin-top: calc(var(--space) * 1.5); font-size: 12px; color: var(--text-faint); }
			.help.error { color: var(--danger); }
			.select { justify-content: space-between; }
			.menu { padding: calc(var(--space) * 1.5); min-width: 200px; }
			.menu .item { display: flex; align-items: center; gap: calc(var(--space) * 2); height: calc(var(--space) * 8); padding: 0 calc(var(--space) * 2.5); border-radius: var(--radius-sm); }
			.menu .item.hover { background: var(--hover); }
			.menu .item .chk { margin-left: auto; color: var(--accent); }
			.menu .item.danger { color: var(--danger); }
			.menu .item kbd { margin-left: auto; }
			.menu hr { border: 0; border-top: var(--border-width) solid var(--line); margin: calc(var(--space) * 1.5) 0; }

			.switch { position: relative; width: 32px; height: 18px; border-radius: var(--radius-pill); background: var(--surface-raised); border: var(--border-width) solid var(--line); }
			.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--text-faint); }
			.switch.on { background: var(--accent); border-color: var(--accent); }
			.switch.on::after { left: 16px; background: var(--on-accent); }
			.check { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: var(--radius-sm); border: var(--border-width) solid var(--line); background: var(--surface-raised); }
			.check.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
			.check.on svg { width: 12px; height: 12px; stroke-width: 2.5; }
			.radio { width: 16px; height: 16px; border-radius: 50%; border: var(--border-width) solid var(--line); background: var(--surface-raised); }
			.radio.on { border: 5px solid var(--accent); background: var(--on-accent); }
			.toggle-row { display: flex; align-items: center; gap: calc(var(--space) * 2); color: var(--text-muted); }

			.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--radius-pill) !important; font-size: 12px; color: var(--text-muted); }
			.chip.on { background: var(--accent-soft); border-color: transparent; color: var(--text); }
			.pill { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 500; background: var(--hover); color: var(--text-muted); }
			.pill.accent { background: var(--accent-soft); color: var(--accent); }
			.pill.success { background: var(--success-soft); color: var(--success); }
			.pill.warning { background: var(--warning-soft); color: var(--warning); }
			.pill.danger { background: var(--danger-soft); color: var(--danger); }
			kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; font: 11px var(--font-mono); color: var(--text-muted); border: var(--border-width) solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
			.avatar { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 600; }

			.collapsible .c-head { display: flex; align-items: center; gap: calc(var(--space) * 2); padding: calc(var(--space) * 3); font-weight: 500; }
			.collapsible .c-head small { color: var(--text-faint); font-weight: 400; }
			.collapsible .c-head svg { transform: rotate(90deg); color: var(--text-faint); }
			.collapsible .c-body { padding: 0 calc(var(--space) * 3) calc(var(--space) * 3) calc(var(--space) * 9); color: var(--text-muted); }

			.spinner { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--focus); }
			.progress { width: 160px; height: 4px; border-radius: var(--radius-pill); background: var(--surface-raised); overflow: hidden; }
			.progress i { display: block; width: 62%; height: 100%; background: var(--focus); border-radius: inherit; }
			.skeleton { display: grid; gap: 6px; width: 140px; }
			.skeleton i { height: 8px; border-radius: var(--radius-pill); background: linear-gradient(90deg, var(--surface-raised) 30%, var(--skeleton-highlight) 50%, var(--surface-raised) 70%); }
			.skeleton i:last-child { width: 60%; }
			.tooltip { display: inline-block; padding: 5px 9px; font-size: 12px; background: var(--text); color: var(--ground); border: 0; box-shadow: none; }
			.tooltip.look-open { border-radius: var(--radius-sm); }

			.toast { display: flex; align-items: center; gap: calc(var(--space) * 2.5); padding: calc(var(--space) * 3) calc(var(--space) * 3.5); }
			.toast.look-open { background: var(--surface); }
			.toast .ok { color: var(--success); }
			.toast .act { margin-left: auto; color: var(--accent); font-weight: 500; }
			.scrim { padding: calc(var(--space) * 5); background: var(--scrim); border-radius: var(--radius); }
			.dialog { padding: calc(var(--space) * 5); }
			.dialog h3 { margin: 0; font-family: var(--font-display); font-weight: var(--display-weight); font-size: 17px; }
			.dialog p { margin: calc(var(--space) * 2) 0 calc(var(--space) * 5); color: var(--text-muted); font-family: var(--font-body); }
			.dialog .actions { display: flex; justify-content: flex-end; gap: calc(var(--space) * 2); }
			.state { text-align: center; padding: calc(var(--space) * 5) calc(var(--space) * 3); }
			.state.look-open { border-style: dashed; border-radius: var(--radius); }
			.state svg { width: 28px; height: 28px; color: var(--text-faint); }
			.state h4 { margin: calc(var(--space) * 2) 0 calc(var(--space) * 1); font-weight: 600; }
			.state p { margin: 0 0 calc(var(--space) * 3); color: var(--text-muted); font-size: 12px; }
		</style>
	</head>
	<body>
		<div class="sheet" id="sheet"></div>
		<!--THEME-DATA-->
		<script>
			const T = window.THEME;
			const ICONS = {
				search: '<circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/>',
				plus: '<path d="M12 5v14M5 12h14"/>',
				x: '<path d="M6 6l12 12M18 6 6 18"/>',
				check: '<path d="M5 12.5l4.5 4.5L19 7"/>',
				chevD: '<path d="M6 9l6 6 6-6"/>',
				chevR: '<path d="M9 6l6 6-6 6"/>',
				folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
				file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"/>',
				sliders: '<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="17" r="2"/>',
				more: '<path d="M5 12h.01M12 12h.01M19 12h.01"/>',
				inbox: '<path d="M3 13l3-8h12l3 8v6H3zM3 13h5l1 2h6l1-2h5"/>',
				user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
				panel: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
				trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
			};
			const i = (n) => `<svg class="i" viewBox="0 0 24 24">${ICONS[n]}</svg>`;
			const look = (id) => `looked look-${T.looks[id] ?? 'soft'}`;
			const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
			const SWATCHES = [
				['ground', 'Ground'], ['surface', 'Surface'], ['surface-raised', 'Raised'], ['line', 'Line'],
				['text', 'Text'], ['text-muted', 'Muted'], ['text-faint', 'Faint'], ['accent', 'Accent'],
				['focus', 'Focus'], ['success', 'Success'], ['warning', 'Warning'], ['danger', 'Danger'],
			];
			const activeStyle = T.motion.find((m) => m.slot === 'entry.active')?.preset === 'bar' ? 'bar' : '';

			const panel = (mode) => `
<section class="panel" data-theme="${mode}">
	<div class="panel-head"><span class="label">${mode === 'dark' ? 'Dark · default' : 'Light'}</span><span class="label">${esc(T.name)}</span></div>
	<div class="swatches">${SWATCHES.map(([k, n]) => `<div class="swatch" data-token="${k}"><i style="background:var(--${k})"></i><b>${n}</b><code></code></div>`).join('')}</div>
	<div class="type stack">
		<div><small>display</small><span class="t-display">The quick brown fox</span></div>
		<div><small>body</small><span class="t-body">Long text reads comfortably at this size and measure.</span></div>
		<div><small>ui</small><span>New project · Settings · 3 items selected</span></div>
		<div><small>mono</small><span class="t-mono">cargo test --workspace</span></div>
	</div>
	<div class="row">
		<span class="btn ${look('ui/button')}">Neutral</span>
		<span class="btn ${look('ui/button')} primary">${i('plus')}Primary</span>
		<span class="btn ${look('ui/button')} danger">${i('trash')}Delete</span>
		<span class="btn ${look('ui/button')} ghost">Ghost</span>
		<span class="btn ${look('ui/button')} disabled">Disabled</span>
		<span class="btn ${look('ui/button')} icon">${i('more')}</span>
		<span class="close ${look('ui/close-button')}">${i('x')}</span>
	</div>
	<div class="window">
		<nav class="sidebar is-panel ${look('ui/sidebar')}">
			<div class="sb-head"><span>App</span><span style="color:var(--text-faint)">${i('panel')}</span></div>
			<div class="search ${look('ui/search')}">${i('search')}<span>Search</span><kbd>⌘K</kbd></div>
			<div class="group"><span style="color:var(--text-faint)">${i('chevD')}</span><span class="label">Projects</span><span class="count">12</span></div>
			<div class="entry active ${activeStyle}">${i('folder')}Website</div>
			<div class="entry hover">${i('folder')}Mobile app<span class="meta-r">2d</span></div>
			<div class="entry">${i('folder')}Research</div>
			<div class="entry sb-foot">${i('user')}Account</div>
		</nav>
		<div class="main">
			<div class="topbar ${look('ui/topbar')}"><strong>Website</strong><div class="row"><span class="btn ${look('ui/button')} ghost icon">${i('search')}</span><span class="btn ${look('ui/button')} ghost icon">${i('sliders')}</span></div></div>
			<div class="content">
				<div class="tabs ${look('ui/tabs')}"><span class="on">Overview</span><span>Files</span><span>Activity</span></div>
				<div class="card is-panel ${look('ui/card')}"><div class="card-head">${i('file')}Release notes<span class="pill success" style="margin-left:auto">Published</span></div><p>What changed in this version and why it matters.</p></div>
				<div class="state is-panel ${look('ui/state-page')}">${i('inbox')}<h4>No files yet</h4><p>Drop files here or add them from your computer.</p><span class="btn ${look('ui/button')} primary">Add files</span></div>
			</div>
		</div>
	</div>
	<div class="grid2">
		<div class="stack">
			<div class="field"><label>Name</label><div class="input ${look('ui/text-field')} focused">Website</div><div class="help">Shown in the sidebar.</div></div>
			<div class="field"><label>Folder</label><div class="input ${look('ui/text-field')} error">~/Projects/</div><div class="help error">This folder doesn't exist.</div></div>
			<div class="toggle-row"><span class="switch on"></span>Sync automatically</div>
			<div class="toggle-row"><span class="switch"></span>Show hidden files</div>
			<div class="toggle-row"><span class="check on">${i('check')}</span>Remember me<span class="radio on" style="margin-left:16px"></span>Daily<span class="radio"></span>Weekly</div>
		</div>
		<div class="stack">
			<div class="field"><label>Sort by</label><div class="input select ${look('ui/select')}">Last modified<span style="color:var(--text-faint)">${i('chevD')}</span></div></div>
			<div class="menu is-panel ${look('ui/menu')}">
				<div class="item">${i('file')}Name</div>
				<div class="item hover">${i('sliders')}Last modified<span class="chk">${i('check')}</span></div>
				<div class="item">${i('folder')}Size<kbd>⌘3</kbd></div>
				<hr />
				<div class="item danger">${i('trash')}Clear history</div>
			</div>
		</div>
	</div>
	<div class="row">
		<span class="chip ${look('ui/chips')} on">${i('check')}Selected</span>
		<span class="chip ${look('ui/chips')}">Filter</span>
		<span class="pill">Neutral</span><span class="pill accent">Accent</span><span class="pill success">Success</span><span class="pill warning">Warning</span><span class="pill danger">Danger</span>
		<kbd>⌘</kbd><kbd>K</kbd><span class="avatar">AL</span>
	</div>
	<div class="collapsible is-panel ${look('ui/collapsible')}"><div class="c-head">${i('chevR')}Advanced<small>3 settings</small></div><div class="c-body">Options most people never need to change.</div></div>
	<div class="row" style="gap:calc(var(--space) * 6)">
		<span class="spinner"></span>
		<span class="progress"><i></i></span>
		<span class="skeleton"><i></i><i></i></span>
		<span class="tooltip ${look('ui/tooltip')}">Toggle sidebar <span class="mono">⌘B</span></span>
	</div>
	<div class="grid2">
		<div class="toast is-panel ${look('ui/toast')}"><span class="ok">${i('check')}</span>Project saved<span class="act">Undo</span></div>
		<div class="scrim"><div class="dialog is-panel ${look('ui/dialog')}"><h3>Delete project?</h3><p>This removes 12 files. It can't be undone.</p><div class="actions"><span class="btn ${look('ui/button')}">Cancel</span><span class="btn ${look('ui/button')} danger">Delete</span></div></div></div>
	</div>
</section>`;

			const counts = Object.values(T.looks).reduce((a, l) => ((a[l] = (a[l] ?? 0) + 1), a), {});
			const typo = Object.fromEntries(T.typography.map((r) => [r.role, r.family]));
			const half = Math.ceil(T.motion.length / 2);
			const lookRows = Object.entries(T.looks);
			const lookHalf = Math.ceil(lookRows.length / 2);
			const looksTable = (rows) => `<table>${rows.map(([id, l]) => `<tr><td>${id}</td><td>${l}</td></tr>`).join('')}</table>`;
			const motionTable = (rows) => `<table>${rows.map((m) => `<tr><td>${m.slot}</td><td>${m.preset}</td><td>${m.duration} · ${m.curve}</td></tr>`).join('')}</table>`;

			document.getElementById('sheet').innerHTML = `
<header>
	<div>
		<div class="eyebrow">Theme · ${esc(T.schema)}</div>
		<h1>${esc(T.name)}</h1>
		<p>${esc(T.description)}</p>
	</div>
	<dl class="meta">
		${['Display', 'Body', 'Interface', 'Mono'].map((r) => `<dt>${r}</dt><dd>${esc(typo[r] ?? '–')}</dd>`).join('')}
		<dt>Radius</dt><dd class="v-radius"></dd>
		<dt>Icons</dt><dd>${esc(T.icons)}</dd>
		<dt>Looks</dt><dd>${Object.entries(counts).map(([l, n]) => `${l} ${n}`).join(' · ')}</dd>
	</dl>
</header>
<div class="panels">${panel('dark')}${panel('light')}</div>
<div class="below">
	<div><h2 class="eyebrow">Motion slots</h2><div class="cols">${motionTable(T.motion.slice(0, half))}${motionTable(T.motion.slice(half))}</div></div>
	<div><h2 class="eyebrow">Looks</h2><div class="cols">${looksTable(lookRows.slice(0, lookHalf))}${looksTable(lookRows.slice(lookHalf))}</div></div>
</div>`;

			for (const p of document.querySelectorAll('.panel')) {
				const cs = getComputedStyle(p);
				for (const s of p.querySelectorAll('.swatch')) s.querySelector('code').textContent = cs.getPropertyValue(`--${s.dataset.token}`).trim();
			}
			const root = getComputedStyle(document.documentElement);
			document.querySelector('.v-radius').textContent = ['--radius-sm', '--radius', '--radius-lg'].map((v) => root.getPropertyValue(v).trim()).join(' / ');
		</script>
	</body>
</html>
