# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# Runs in CI as the `deny` check. Fails on vulnerable or yanked crates, licenses not listed below,
# and crates from anywhere but crates.io.

[graph]
all-features = true

[advisories]
yanked = "deny"
# Unmaintained crates deep in the Tauri tree are not actionable here; flag only direct dependencies.
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.9
# Common permissive licenses stay allowed even when no current dependency uses them.
unused-allowed-license = "allow"
allow = [
	"MIT",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Zlib",
	"Unicode-3.0",
	"MPL-2.0",
	"CC0-1.0",
	"BSL-1.0",
	"0BSD",
	"Unlicense",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
